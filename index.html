<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ScrollTestingFile</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Palanquin:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Progress Bar (GPU accelerated scaleX) -->
  <div id="progress-bar-container">
    <div id="progress-bar"></div>
  </div>

  <!-- Crossfading Background Layers (behind the canvas) -->
  <div id="bgA" class="bg-layer"></div>
  <div id="bgB" class="bg-layer"></div>

  <!-- Canvas for 3D Scene (transparent, stays fixed) -->
  <canvas id="three-canvas"></canvas>

  <!-- Overlay UI Container: Houses centered subheadings, bottom-docked infoboxes, & fullcover sections -->
  <div id="info-container">
    <!-- Full-Screen Solid Coverage Section (hides 3D mountain behind solid cover) -->
    <div id="fullcover-display" class="fullcover-display hidden">
      <div id="fullcover-content" class="fullcover-content"></div>
    </div>

    <!-- Centered Subheading Slot (mutually exclusive with infobox) -->
    <div id="subheading-display" class="subheading-display hidden">
      <h2 id="subheading-text" class="section-subheading"></h2>
      <p id="subheading-note" class="section-subheading-note"></p>
    </div>

    <!-- Bottom Docked Infobox Slot -->
    <div id="infobox-dock" class="infobox-dock">
      <div id="active-infobox" class="infobox hidden">
        <div id="infobox-content" class="infobox-content"></div>
      </div>
    </div>
  </div>

  <!-- Scroll Sections (placeholders for driving camera and story progress) -->
  <div class="scroll-section" id="section00">
    <h1 class="hero-title">The stories of Mukkumlung</h1>
  </div>
  <div class="scroll-section" id="section01"></div>
  <div class="scroll-section" id="section02"></div>
  <div class="scroll-section" id="section02_1"></div>
  <div class="scroll-section" id="section02_2"></div>
  <div class="scroll-section" id="section03"></div>
  <div class="scroll-section" id="section04"></div>
  <div class="scroll-section" id="section04_1"></div>
  <div class="scroll-section" id="section04_2"></div>
  <div class="scroll-section" id="section04_3"></div>
  <div class="scroll-section" id="section06"></div>
  <div class="scroll-section" id="section06_2"></div>
  <div class="scroll-section" id="section07"></div>
  <div class="scroll-section" id="section07_2"></div>
  <div class="scroll-section" id="section07_3"></div>
  <div class="scroll-section" id="section08"></div>
  <div class="scroll-section" id="section09"></div>
  <div class="scroll-section" id="section09_2"></div>
  <div class="scroll-section" id="section09_3"></div>
  <div class="scroll-section" id="section10"></div>
  <div class="scroll-section" id="section10_2"></div>
  <div class="scroll-section" id="section11"></div>
  <div class="scroll-section" id="section12"></div>
  <div class="scroll-section" id="section13"></div>
  <div class="scroll-section" id="section14"></div>
  <div class="scroll-section" id="section15"></div>
  <div style="height: 50vh;"></div>

  <!-- Main Script -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
